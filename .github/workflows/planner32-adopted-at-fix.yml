name: Planner32 AdoptedAt Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-32-interior-difficulty-policy
      - name: Correct policy adoption timestamp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/data/zooInteriorDifficultyAuthority.ts')
          s=p.read_text()
          old='const ADOPTED_AT = "2026-09-11T10:00:00-07:00" as const;'
          new='const ADOPTED_AT = "2026-09-11T09:55:00-07:00" as const;'
          if s.count(old) != 1:
              raise SystemExit('expected exactly one adoptedAt target')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "flesentine"
          git config user.email "chrisgmcc@gmail.com"
          git add src/data/zooInteriorDifficultyAuthority.ts
          git commit -m "Planner 32: correct policy adoption timestamp"
          git push origin HEAD:planner/planner-32-interior-difficulty-policy
