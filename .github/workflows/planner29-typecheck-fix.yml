name: Planner29 Typecheck Fix

on: push

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-29-interior-pedestrian-direction
      - name: Remove redundant disjoint-literal comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/data/zooInteriorPedestrianDirectionAuthority.ts')
          text = path.read_text()
          old = '''  if (\n    PEDESTRIAN_DIRECTION_RESOLUTION_POLICY.scope !==\n      "highway-pedestrian-ingress-ways" ||\n    policy.scope === PEDESTRIAN_DIRECTION_RESOLUTION_POLICY.scope\n  ) {\n'''
          new = '''  if (\n    PEDESTRIAN_DIRECTION_RESOLUTION_POLICY.scope !==\n      "highway-pedestrian-ingress-ways"\n  ) {\n'''
          if old not in text:
              print('Target comparison already absent; no source change needed.')
          else:
              if text.count(old) != 1:
                  raise SystemExit('Expected exactly one target comparison')
              path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit source fix when needed
        shell: bash
        run: |
          if git diff --quiet -- src/data/zooInteriorPedestrianDirectionAuthority.ts; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name "flesentine"
          git config user.email "chrisgmcc@gmail.com"
          git add src/data/zooInteriorPedestrianDirectionAuthority.ts
          git commit -m "Planner 29: fix interior scope typecheck"
          git push origin HEAD:planner/planner-29-interior-pedestrian-direction
