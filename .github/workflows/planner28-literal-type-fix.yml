name: Planner28 Literal Type Fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-28-objective-segment-distance
      - name: Freeze literal provenance values
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/data/zooInteriorObjectiveSegmentDistanceAuthority.ts")
          text = path.read_text()
          replacements = [
              ("sourceFromNodeVersion: geometry.connectionNode.sourceVersion,", "sourceFromNodeVersion: 1,"),
              ("sourceFromNodeTimestamp: geometry.connectionNode.sourceTimestamp,", "sourceFromNodeTimestamp: \"2019-12-13T00:23:10Z\","),
              ("sourceFromNodeChangeset: geometry.connectionNode.sourceChangeset,", "sourceFromNodeChangeset: 78341336,"),
              ("sourceToNodeVersion: selectedCandidate.node.sourceVersion,", "sourceToNodeVersion: 2,"),
              ("sourceToNodeTimestamp: selectedCandidate.node.sourceTimestamp,", "sourceToNodeTimestamp: \"2013-12-23T19:47:46Z\","),
              ("sourceToNodeChangeset: selectedCandidate.node.sourceChangeset,", "sourceToNodeChangeset: 19606502,"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "flesentine"
          git config user.email "chrisgmcc@gmail.com"
          git add src/data/zooInteriorObjectiveSegmentDistanceAuthority.ts
          git commit -m "Planner 28: freeze literal provenance types"
          git push origin HEAD:planner/planner-28-objective-segment-distance
