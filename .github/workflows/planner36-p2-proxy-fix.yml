name: Planner 36 P2 proxy fix

on:
  push:
    branches:
      - planner/planner-36-interior-stroller-evidence
    paths:
      - .github/workflows/planner36-p2-proxy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-36-interior-stroller-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Apply P2 proxy-boundary fix
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Planner tests
        run: npm run test:planner
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStrollerAuthority.ts tests/zoo-interior-stroller-authority.test.ts
          git diff --cached --check
          git commit -m "Harden Planner 36 proxy boundary"
          git push origin HEAD:planner/planner-36-interior-stroller-evidence
