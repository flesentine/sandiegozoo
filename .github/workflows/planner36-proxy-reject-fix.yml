test("Planner 36 rejects proxies that hide configurable semantic fields", () => {
  const audit = mutableAudit() as InteriorStrollerEvidenceAudit & {
    stroller?: boolean;
  };
  audit.stroller = true;
  const proxiedAudit = new Proxy(audit, {
    ownKeys(target) {
      return Reflect.ownKeys(target).filter(
        (key) => key !== "stroller",
      );
    },
  });

  assert.throws(
    () => assertInteriorStrollerEvidenceAuditIntegrity([proxiedAudit]),
    /cannot be Proxy-backed/,
  );
  assert.equal(proxiedAudit.stroller, true);
});

