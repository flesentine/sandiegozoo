name: Planner 36 P2 patch

on:
  push:
    branches:
      - planner/planner-36-interior-stroller-evidence
    paths:
      - .github/workflows/planner36-p2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-36-interior-stroller-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Apply primitive-boundary hardening and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/data/zooInteriorStrollerAuthority.ts")
          source = source_path.read_text()
          old_url = "function validExactUrl(value: string, expected: string) {\n  try {\n    return new URL(value).toString() === expected;\n  } catch {\n    return false;\n  }\n}\n"
          new_url = "function validExactUrl(value: unknown, expected: string) {\n  if (typeof value !== \"string\" || value !== expected) {\n    return false;\n  }\n\n  try {\n    return new URL(value).toString() === expected;\n  } catch {\n    return false;\n  }\n}\n\nfunction assertObjectiveSourceRecordId(\n  value: unknown,\n): asserts value is string {\n  if (\n    typeof value !== \"string\" ||\n    value.trim().length === 0 ||\n    value !== value.trim()\n  ) {\n    throw new Error(\n      \"Planner 36 objectiveSourceRecordId must be a primitive stable string.\",\n    );\n  }\n}\n"
          if source.count(old_url) != 1:
              raise SystemExit(f"expected one URL helper match, found {source.count(old_url)}")
          source = source.replace(old_url, new_url, 1)

          old_lookup = "export function interiorStrollerEvidenceAuditForObjective(\n  objectiveSourceRecordId: string,\n) {\n  return INTERIOR_STROLLER_EVIDENCE_AUDIT.find(\n"
          new_lookup = "export function interiorStrollerEvidenceAuditForObjective(\n  objectiveSourceRecordId: string,\n) {\n  assertObjectiveSourceRecordId(objectiveSourceRecordId);\n\n  return INTERIOR_STROLLER_EVIDENCE_AUDIT.find(\n"
          if source.count(old_lookup) != 1:
              raise SystemExit(f"expected one lookup match, found {source.count(old_lookup)}")
          source = source.replace(old_lookup, new_lookup, 1)
          source_path.write_text(source)

          test_path = Path("tests/zoo-interior-stroller-authority.test.ts")
          tests = test_path.read_text()
          marker = "test(\"Planner 36 runtime boundary rejects accessor-backed audit array elements without invoking them\", () => {\n"
          additions = "test(\"Planner 36 rejects coercible non-string guide URLs without invoking caller code\", () => {\n  const audit = mutableAudit();\n  let coercions = 0;\n  const coercibleUrl = {\n    toString() {\n      coercions += 1;\n      return \"https://sdzwa.org/sdzwa-accessibility-guide\";\n    },\n    stroller: true,\n  };\n  Object.assign(audit.accessibilityGuideEvidence, {\n    sourceUrl: coercibleUrl as unknown as string,\n  });\n\n  assert.throws(\n    () => assertInteriorStrollerEvidenceAuditIntegrity([audit]),\n    /accessibility-guide evidence drifted/,\n  );\n  assert.equal(coercions, 0);\n});\n\ntest(\"Planner 36 rejects non-string objective IDs before lookup or assessment output\", () => {\n  const cyclic: Record<string, unknown> = {};\n  cyclic.self = cyclic;\n\n  assert.throws(\n    () => interiorStrollerEvidenceAuditForObjective(\n      cyclic as unknown as string,\n    ),\n    /primitive stable string/,\n  );\n  assert.throws(\n    () => assessInteriorStroller(\n      cyclic as unknown as string,\n    ),\n    /primitive stable string/,\n  );\n\n  assert.throws(\n    () => assessInteriorStroller(\n      new String(\"sdz-tiger-trail\") as unknown as string,\n    ),\n    /primitive stable string/,\n  );\n});\n\n"
          if tests.count(marker) != 1:
              raise SystemExit(f"expected one test insertion marker, found {tests.count(marker)}")
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run test:planner
      - run: npm run typecheck
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStrollerAuthority.ts tests/zoo-interior-stroller-authority.test.ts
          git commit -m "Fix Planner 36 primitive runtime boundaries"
          git push origin HEAD:planner/planner-36-interior-stroller-evidence
