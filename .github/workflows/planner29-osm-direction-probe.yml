name: Planner29 OSM Direction Probe

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Front Street way v1 tags
        run: |
          set -e
          curl -fsSL 'https://api.openstreetmap.org/api/0.6/way/1481425058/1' -o /tmp/way.xml
          python3 -c "import xml.etree.ElementTree as ET; w=ET.parse('/tmp/way.xml').getroot().find('way'); print('WAY_METADATA', w.attrib); print('NODE_REFS', [n.attrib['ref'] for n in w.findall('nd')]); print('TAGS', {t.attrib['k']:t.attrib['v'] for t in w.findall('tag')})"
