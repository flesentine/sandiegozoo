name: Planner 34 neutral clock fix

on:
  push:
    branches:
      - planner/planner-34-interior-operational-status

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planner/planner-34-interior-operational-status
          fetch-depth: 0

      - name: Apply neutral clock extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ingress_path = Path('src/data/zooIngressRuntimeActivation.ts')
          ingress = ingress_path.read_text()

          anchor = 'import {\n  INGRESS_ROUTE_EDGE_BINDINGS,\n'
          neutral_import = (
              'import {\n'
              '  SAN_DIEGO_ZOO_TIME_ZONE,\n'
              '  zooOperationalDateAt,\n'
              '} from "./zooOperationalClock.ts";\n'
              'import {\n'
              '  INGRESS_ROUTE_EDGE_BINDINGS,\n'
          )
          if anchor not in ingress:
              raise SystemExit('ingress import anchor not found')
          ingress = ingress.replace(anchor, neutral_import, 1)

          routing_anchor = '} from "../planner/routing.ts";\n\n'
          routing_replacement = (
              '} from "../planner/routing.ts";\n\n'
              'export {\n'
              '  SAN_DIEGO_ZOO_TIME_ZONE,\n'
              '  zooOperationalDateAt,\n'
              '};\n\n'
          )
          if routing_anchor not in ingress:
              raise SystemExit('routing import anchor not found')
          ingress = ingress.replace(routing_anchor, routing_replacement, 1)

          ingress, count = re.subn(
              r'export const SAN_DIEGO_ZOO_TIME_ZONE =\n  "America/Los_Angeles" as const;\n\n',
              '',
              ingress,
              count=1,
          )
          if count != 1:
              raise SystemExit('timezone declaration not removed exactly once')

          ingress, count = re.subn(
              r'export function zooOperationalDateAt\(\n  nowMs: number,\n\) \{.*?\n\}\n\nfunction assertTimedEvidence',
              'function assertTimedEvidence',
              ingress,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('zooOperationalDateAt function not removed exactly once')

          ingress_path.write_text(ingress)

          interior_path = Path('src/data/zooInteriorOperationalStatusAuthority.ts')
          interior = interior_path.read_text()
          old = '} from "./zooIngressRuntimeActivation.ts";'
          new = '} from "./zooOperationalClock.ts";'
          if interior.count(old) != 1:
              raise SystemExit('interior clock import did not match exactly once')
          interior_path.write_text(interior.replace(old, new, 1))

          test_path = Path('tests/zoo-interior-operational-status-authority.test.ts')
          test_text = test_path.read_text()
          old = '} from "../src/data/zooIngressRuntimeActivation.ts";'
          new = '} from "../src/data/zooOperationalClock.ts";'
          if test_text.count(old) != 1:
              raise SystemExit('test clock import did not match exactly once')
          test_path.write_text(test_text.replace(old, new, 1))

          doc_path = Path('docs/planner/PLANNER_INTERIOR_OPERATIONAL_STATUS_AUTHORITY.md')
          doc = doc_path.read_text()
          doc = doc.replace(
              'through the existing Planner 24 Zoo-date helper.',
              'through the neutral Zoo operational clock extracted from Planner 24.',
          )
          doc_path.write_text(doc)
          PY

          git diff --check
          git diff -- src/data/zooIngressRuntimeActivation.ts src/data/zooInteriorOperationalStatusAuthority.ts tests/zoo-interior-operational-status-authority.test.ts docs/planner/PLANNER_INTERIOR_OPERATIONAL_STATUS_AUTHORITY.md

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooIngressRuntimeActivation.ts src/data/zooInteriorOperationalStatusAuthority.ts tests/zoo-interior-operational-status-authority.test.ts docs/planner/PLANNER_INTERIOR_OPERATIONAL_STATUS_AUTHORITY.md
          git commit -m "Planner 34: decouple Zoo operational clock"
          git push origin HEAD:planner/planner-34-interior-operational-status
