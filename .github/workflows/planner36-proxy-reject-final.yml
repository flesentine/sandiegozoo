name: Planner 36 proxy rejection final

on:
  push:
    branches:
      - planner/planner-36-interior-stroller-evidence
    paths:
      - .github/workflows/planner36-proxy-reject-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-36-interior-stroller-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Reject Proxy-backed Planner 36 inputs
        run: python -c "import base64; exec(base64.b64decode(''))"
      - run: npm install --no-audit --no-fund
      - run: npm run test:planner
      - run: npm run typecheck
      - run: npm run build
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStrollerAuthority.ts tests/zoo-interior-stroller-authority.test.ts
          git commit -m "Reject Proxy-backed Planner 36 runtime inputs"
          git push origin HEAD:planner/planner-36-interior-stroller-evidence
