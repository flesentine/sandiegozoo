name: Planner26 Node Provenance Probe

on:
  push:
    branches:
      - planner/planner-26-front-street-geometry

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact OSM node provenance
        shell: python
        run: |
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          NODE_IDS = ["7053320515", "1619736626", "6239154982"]

          results = []
          for node_id in NODE_IDS:
              url = f"https://api.openstreetmap.org/api/0.6/node/{node_id}"
              req = urllib.request.Request(url, headers={"User-Agent": "WildRoute-Planner26-node-provenance/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  root = ET.fromstring(response.read())
              node = root.find("node")
              if node is None:
                  raise SystemExit(f"node {node_id} missing")
              results.append({
                  "id": node_id,
                  "version": int(node.attrib["version"]),
                  "timestamp": node.attrib["timestamp"],
                  "lat": float(node.attrib["lat"]),
                  "lon": float(node.attrib["lon"]),
                  "changeset": int(node.attrib["changeset"]),
              })

          print("NODE_PROVENANCE=" + json.dumps(results, separators=(",", ":"), sort_keys=True))
