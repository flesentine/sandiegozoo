name: Planner 36 proxy rejection retrigger

on:
  push:
    branches:
      - planner/planner-36-interior-stroller-evidence
    paths:
      - .github/workflows/planner36-retrigger.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-36-interior-stroller-evidence
          fetch-depth: 0
      - name: Preserve coercion regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/zoo-interior-stroller-authority.test.ts")
          text = path.read_text()
          title = 'test("Planner 36 rejects coercible non-string guide URLs without invoking caller code", () => {'
          start = text.index(title)
          end = text.index('\n});', start) + len('\n});')
          block = text[start:end]
          old = '/accessibility-guide evidence drifted/'
          new = '/(accessibility-guide evidence drifted|cannot be Proxy-backed)/'
          if block.count(old) != 1:
              raise SystemExit(f"coercion regex count {block.count(old)}")
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/zoo-interior-stroller-authority.test.ts
          git commit -m "Align Planner 36 coercion regression with proxy rejection"
          git push origin HEAD:planner/planner-36-interior-stroller-evidence
