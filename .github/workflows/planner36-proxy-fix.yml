name: Planner 36 proxy hardening

on:
  push:
    branches:
      - planner/planner-36-interior-stroller-evidence
    paths:
      - .github/workflows/planner36-proxy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-36-interior-stroller-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Harden Planner 36 proxy boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          source_path = Path("src/data/zooInteriorStrollerAuthority.ts")
          source = source_path.read_text()
          helpers = base64.b64decode("").decode()
          helper_start = source.index("function assertExactPlainObject(")
          helper_end = source.index("\nfunction validTimestamp", helper_start)
          source = source[:helper_start] + helpers + source[helper_end:]

          policy_start = source.index("export function assertInteriorStrollerEvidenceAuditPolicyIntegrity(")
          policy_end = source.index("\nfunction assertAccessibilityGuideEvidenceIntegrity", policy_start)
          policy = source[policy_start:policy_end]
          old = "  assertExactPlainObject(\n    policy,\n    POLICY_FIELDS,\n    \"Planner 36 stroller evidence-audit policy\",\n  );\n"
          new = "  const normalizedPolicy = snapshotExactPlainObject(\n    policy,\n    POLICY_FIELDS,\n    \"Planner 36 stroller evidence-audit policy\",\n  ) as unknown as InteriorStrollerEvidenceAuditPolicy;\n"
          if policy.count(old) != 1:
              raise SystemExit(f"policy intro count {policy.count(old)}")
          policy = policy.replace(old, new, 1).replace("policy.", "normalizedPolicy.")
          source = source[:policy_start] + policy + source[policy_end:]

          guide_start = source.index("function assertAccessibilityGuideEvidenceIntegrity(")
          guide_end = source.index("\nexport function assertInteriorStrollerEvidenceAuditIntegrity", guide_start)
          guide = source[guide_start:guide_end]
          old = "  assertExactPlainObject(\n    evidence,\n    GUIDE_FIELDS,\n    \"Planner 36 stroller accessibility-guide evidence\",\n  );\n"
          new = "  const normalizedEvidence = snapshotExactPlainObject(\n    evidence,\n    GUIDE_FIELDS,\n    \"Planner 36 stroller accessibility-guide evidence\",\n  ) as unknown as StrollerAccessibilityGuideEvidence;\n"
          if guide.count(old) != 1:
              raise SystemExit(f"guide intro count {guide.count(old)}")
          guide = guide.replace(old, new, 1).replace("evidence.", "normalizedEvidence.")
          source = source[:guide_start] + guide + source[guide_end:]

          old = "  assertExactOrdinaryArray(\n    audits,\n    1,\n    \"Planner 36 stroller evidence-audit collection\",\n  );\n\n  const candidate: unknown = audits[0];\n  assertExactPlainObject(\n    candidate,\n    AUDIT_FIELDS,\n    \"Planner 36 stroller evidence audit\",\n  );\n  const record =\n    candidate as unknown as InteriorStrollerEvidenceAudit;\n"
          new = "  const normalizedAudits = snapshotExactOrdinaryArray(\n    audits,\n    1,\n    \"Planner 36 stroller evidence-audit collection\",\n  );\n\n  const candidate = snapshotExactPlainObject(\n    normalizedAudits[0],\n    AUDIT_FIELDS,\n    \"Planner 36 stroller evidence audit\",\n  );\n  const record =\n    candidate as unknown as InteriorStrollerEvidenceAudit;\n"
          if source.count(old) != 1:
              raise SystemExit(f"audit intro count {source.count(old)}")
          source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path("tests/zoo-interior-stroller-authority.test.ts")
          tests = test_path.read_text()
          regression = base64.b64decode("").decode()
          marker = 'test("Planner 36 rejects non-string objective IDs before lookup or assessment output", () => {\n'
          if tests.count(marker) != 1:
              raise SystemExit(f"test marker count {tests.count(marker)}")
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run test:planner
      - run: npm run typecheck
      - run: npm run build
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStrollerAuthority.ts tests/zoo-interior-stroller-authority.test.ts
          git commit -m "Harden Planner 36 proxy runtime boundary"
          git push origin HEAD:planner/planner-36-interior-stroller-evidence
