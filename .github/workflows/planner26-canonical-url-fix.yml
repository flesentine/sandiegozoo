name: Planner26 Canonical URL Fix

on:
  push:
    branches:
      - planner/planner-26-front-street-geometry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-26-front-street-geometry
          fetch-depth: 0
      - name: Patch canonical OSM URL validation and regressions
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/data/zooInteriorFrontStreetGeometryAuthority.ts')
          source = source_path.read_text()
          old_object = '''function validOsmObjectUrl(
            value: unknown,
            objectType: "node" | "way",
            objectId: unknown,
          ) {
            if (typeof value !== "string" || typeof objectId !== "string") {
              return false;
            }
            try {
              const url = new URL(value);
              return (
                url.protocol === "https:" &&
                url.hostname === "www.openstreetmap.org" &&
                url.pathname === `/${objectType}/${objectId}`
              );
            } catch {
              return false;
            }
          }
          '''
          new_object = '''function validOsmObjectUrl(
            value: unknown,
            objectType: "node" | "way",
            objectId: unknown,
          ) {
            if (typeof value !== "string" || typeof objectId !== "string") {
              return false;
            }

            return value === `https://www.openstreetmap.org/${objectType}/${objectId}`;
          }
          '''
          old_version = '''function validOsmVersionUrl(
            value: unknown,
            objectType: "node" | "way",
            objectId: unknown,
            version: unknown,
          ) {
            if (
              typeof value !== "string" ||
              typeof objectId !== "string" ||
              typeof version !== "number" ||
              !Number.isSafeInteger(version) ||
              version < 1
            ) {
              return false;
            }
            try {
              const url = new URL(value);
              return (
                url.protocol === "https:" &&
                url.hostname === "api.openstreetmap.org" &&
                url.pathname === `/api/0.6/${objectType}/${objectId}/${version}`
              );
            } catch {
              return false;
            }
          }
          '''
          new_version = '''function validOsmVersionUrl(
            value: unknown,
            objectType: "node" | "way",
            objectId: unknown,
            version: unknown,
          ) {
            if (
              typeof value !== "string" ||
              typeof objectId !== "string" ||
              typeof version !== "number" ||
              !Number.isSafeInteger(version) ||
              version < 1
            ) {
              return false;
            }

            return (
              value ===
              `https://api.openstreetmap.org/api/0.6/${objectType}/${objectId}/${version}`
            );
          }
          '''
          if old_object in source:
              source = source.replace(old_object, new_object, 1)
          elif new_object not in source:
              raise SystemExit('object URL validator shape changed unexpectedly')
          if old_version in source:
              source = source.replace(old_version, new_version, 1)
          elif new_version not in source:
              raise SystemExit('version URL validator shape changed unexpectedly')
          source_path.write_text(source)

          test_path = Path('tests/zoo-interior-front-street-geometry-authority.test.ts')
          tests = test_path.read_text()
          marker = 'test("Planner 26 authority and assessment are deeply immutable", () => {'
          regression = '''test("Planner 26 requires complete canonical OSM provenance URLs", () => {
            const wayQuery = mutableClone();
            (wayQuery as { sourceWayVersionUrl: string }).sourceWayVersionUrl += "?download=1";
            assert.throws(
              () => assertInteriorFrontStreetGeometryAuthorityIntegrity([wayQuery]),
              /Front Street source-way provenance is malformed/,
            );

            const nodeCredentials = mutableClone();
            (nodeCredentials.connectionNode as { sourceVersionUrl: string }).sourceVersionUrl =
              "https://user@api.openstreetmap.org/api/0.6/node/7053320515/1";
            assert.throws(
              () => assertInteriorFrontStreetGeometryAuthorityIntegrity([nodeCredentials]),
              /connection node drifted from versioned OSM node provenance/,
            );

            const nodePort = mutableClone();
            const previousNode = nodePort.adjacentJunctionCandidates[0].node as {
              sourceVersionUrl: string;
            };
            previousNode.sourceVersionUrl =
              "https://api.openstreetmap.org:444/api/0.6/node/1619736626/2";
            assert.throws(
              () => assertInteriorFrontStreetGeometryAuthorityIntegrity([nodePort]),
              /previous adjacent node drifted from versioned OSM node provenance/,
            );

            const connectorFragment = mutableClone();
            const previousConnector = connectorFragment.adjacentJunctionCandidates[0] as {
              connectorWayVersionUrl: string;
            };
            previousConnector.connectorWayVersionUrl += "#fragment";
            assert.throws(
              () => assertInteriorFrontStreetGeometryAuthorityIntegrity([connectorFragment]),
              /previous adjacent junction evidence drifted/,
            );
          });

          '''
          if regression not in tests:
              if marker not in tests:
                  raise SystemExit('test insertion marker missing')
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "flesentine"
          git config user.email "186269227+flesentine@users.noreply.github.com"
          git add src/data/zooInteriorFrontStreetGeometryAuthority.ts tests/zoo-interior-front-street-geometry-authority.test.ts
          git commit -m "Planner 26: require canonical OSM provenance URLs"
          git push origin HEAD:planner/planner-26-front-street-geometry
