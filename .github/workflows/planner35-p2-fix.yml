name: Planner 35 P2 patch

on:
  push:
    branches:
      - planner/planner-35-interior-stairs-policy
    paths:
      - .github/workflows/planner35-p2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-35-interior-stairs-policy
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Apply accessor-array hardening and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/data/zooInteriorStairsAuthority.ts")
          source = source_path.read_text()
          old = "  if (\n    Reflect.ownKeys(value).some(\n      (key) =>\n        typeof key !== \"string\" ||\n        !allowedOwnKeys.has(key),\n    )\n  ) {\n    throw new Error(`${label} cannot contain extra own properties.`);\n  }\n}\n"
          new = "  if (\n    Reflect.ownKeys(value).some(\n      (key) =>\n        typeof key !== \"string\" ||\n        !allowedOwnKeys.has(key),\n    )\n  ) {\n    throw new Error(`${label} cannot contain extra own properties.`);\n  }\n\n  for (let index = 0; index < expectedLength; index += 1) {\n    const descriptor = Object.getOwnPropertyDescriptor(\n      value,\n      String(index),\n    );\n    if (\n      !descriptor ||\n      !descriptor.enumerable ||\n      !(\"value\" in descriptor)\n    ) {\n      throw new Error(\n        `${label} requires enumerable own data element ${index}.`,\n      );\n    }\n  }\n}\n"
          if source.count(old) != 1:
              raise SystemExit(f"expected one source match, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path("tests/zoo-interior-stairs-authority.test.ts")
          tests = test_path.read_text()
          marker = "  assert.throws(\n    () => assertInteriorStairsEvidenceAuditIntegrity(decorated),\n    /extra own properties/,\n  );\n});\n"
          replacement = "  assert.throws(\n    () => assertInteriorStairsEvidenceAuditIntegrity(decorated),\n    /extra own properties/,\n  );\n\n  const accessorBacked = [\n    mutableAudit(),\n  ] as unknown as InteriorStairsEvidenceAudit[];\n  let reads = 0;\n  Object.defineProperty(accessorBacked, \"0\", {\n    enumerable: true,\n    configurable: true,\n    get() {\n      reads += 1;\n      return reads === 1\n        ? mutableAudit()\n        : { ...mutableAudit(), stairs: false };\n    },\n  });\n  assert.throws(\n    () => assertInteriorStairsEvidenceAuditIntegrity(accessorBacked),\n    /enumerable own data element 0/,\n  );\n  assert.equal(reads, 0);\n});\n"
          if tests.count(marker) != 1:
              raise SystemExit(f"expected one test marker, found {tests.count(marker)}")
          test_path.write_text(tests.replace(marker, replacement, 1))
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run test:planner
      - run: npm run typecheck
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStairsAuthority.ts tests/zoo-interior-stairs-authority.test.ts
          git commit -m "Fix Planner 35 accessor-backed audit arrays"
          git push origin HEAD:planner/planner-35-interior-stairs-policy
