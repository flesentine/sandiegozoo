name: Planner 35 P2 patch

on:
  push:
    branches:
      - planner/planner-35-interior-stairs-policy
    paths:
      - .github/workflows/planner35-p2-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: planner/planner-35-interior-stairs-policy
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Apply accessor-array hardening and regression
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/data/zooInteriorStairsAuthority.ts')
          source = source_path.read_text()
          old = '''  if (
    Reflect.ownKeys(value).some(
      (key) =>
        typeof key !== "string" ||
        !allowedOwnKeys.has(key),
    )
  ) {
    throw new Error(`${label} cannot contain extra own properties.`);
  }
}
'''
          new = '''  if (
    Reflect.ownKeys(value).some(
      (key) =>
        typeof key !== "string" ||
        !allowedOwnKeys.has(key),
    )
  ) {
    throw new Error(`${label} cannot contain extra own properties.`);
  }

  for (let index = 0; index < expectedLength; index += 1) {
    const descriptor = Object.getOwnPropertyDescriptor(
      value,
      String(index),
    );
    if (
      !descriptor ||
      !descriptor.enumerable ||
      !("value" in descriptor)
    ) {
      throw new Error(
        `${label} requires enumerable own data element ${index}.`,
      );
    }
  }
}
'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one source match, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/zoo-interior-stairs-authority.test.ts')
          tests = test_path.read_text()
          marker = '''  assert.throws(
    () => assertInteriorStairsEvidenceAuditIntegrity(decorated),
    /extra own properties/,
  );
});
'''
          replacement = '''  assert.throws(
    () => assertInteriorStairsEvidenceAuditIntegrity(decorated),
    /extra own properties/,
  );

  const accessorBacked = [
    mutableAudit(),
  ] as unknown as InteriorStairsEvidenceAudit[];
  let reads = 0;
  Object.defineProperty(accessorBacked, "0", {
    enumerable: true,
    configurable: true,
    get() {
      reads += 1;
      return reads === 1
        ? mutableAudit()
        : { ...mutableAudit(), stairs: false };
    },
  });
  assert.throws(
    () => assertInteriorStairsEvidenceAuditIntegrity(accessorBacked),
    /enumerable own data element 0/,
  );
  assert.equal(reads, 0);
});
'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one test marker, found {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement, 1))
      - run: npm install --no-audit --no-fund
      - run: npm run test:planner
      - run: npm run typecheck
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/zooInteriorStairsAuthority.ts tests/zoo-interior-stairs-authority.test.ts
          git commit -m "Fix Planner 35 accessor-backed audit arrays"
          git push origin HEAD:planner/planner-35-interior-stairs-policy
